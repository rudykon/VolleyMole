[project]
name = "volleycut"
version = "0.1.0"
description = "VolleyCut 阶段0-1 最小检测引擎（本地优先，NVIDIA CUDA EP）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnxruntime-gpu==1.24.1",
    "nvidia-cudnn-cu12==9.25.1.1",
    "nvidia-cublas-cu12==12.9.2.10",
    "numpy==2.3.5",
    "opencv-python-headless==4.13.0.92",
    "pandas==3.0.0",
    "tqdm==4.67.3",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volleycut"]

[tool.uv]
package = false
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_media: uses repository real video excerpts and FFmpeg"]
