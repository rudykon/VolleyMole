<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" fill="none">
  <title>排球场与排球</title>
  <desc>斜向俯瞰的暖木色排球场，搭配蓝色场边，带有清晰边线、三米线、细密球网和立柱；排球造型来自 VolleyMole 项目标志。</desc>
  <!-- The volleyball artwork and its original colors are reused from assets/branding/volleymole.svg. -->
  <defs xmlns="http://www.w3.org/2000/svg"><linearGradient id="Gold" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#FFD04D" /><stop offset="1" stop-color="#F4AA19" /></linearGradient><linearGradient id="Coat" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#765441" /><stop offset="1" stop-color="#563B30" /></linearGradient><linearGradient id="Ink" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#2B2E35" /><stop offset="1" stop-color="#1E2026" /></linearGradient><linearGradient id="Ball_Blue" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#327AC4" /><stop offset="1" stop-color="#1D4E94" /></linearGradient><linearGradient id="Skin" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#FFE0BE" /><stop offset="1" stop-color="#EDBE94" /></linearGradient></defs>
  <defs>
    <filter id="court-shadow" x="-15%" y="-30%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ball-shadow" x="-40%" y="-100%" width="180%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="net-mesh" width="7" height="5" patternUnits="userSpaceOnUse">
      <path d="M7 0H0V5" stroke="#414550" stroke-width=".65" opacity=".72"/>
    </pattern>
  </defs>

  <!-- A shallow court platform and a soft contact shadow. -->
  <path d="M52 233 247 98 674 221 480 357Z" fill="#765441" opacity=".14" filter="url(#court-shadow)"/>
  <path d="M52.4 221.8 480 344.5 480 353.5 52.4 230.8Z" fill="#5f81a0"/>
  <path d="M480 344.5 674.4 208.4 674.4 217.4 480 353.5Z" fill="#476b8d"/>
  <g transform="matrix(1.08 .31 .9 -.63 88 216)">
    <rect x="-18" y="-18" width="396" height="216" rx="7" fill="#92b2cc" stroke="#789cb9" stroke-width="1"/>
    <rect width="360" height="180" fill="#d5a461"/>
    <path d="M120 0H240V180H120Z" fill="#e7bc79"/>
    <path d="M0 0H60V180H0ZM300 0H360V180H300Z" fill="#e0b275" opacity=".55"/>
    <g stroke="#fff5e7" stroke-width=".75" opacity=".24"><path d="M20 0V180"/>
<path d="M40 0V180"/>
<path d="M60 0V180"/>
<path d="M80 0V180"/>
<path d="M100 0V180"/>
<path d="M120 0V180"/>
