<path d="M320 0V180"/>
<path d="M340 0V180"/></g>
    <path d="M0 45H360M0 90H360M0 135H360" stroke="#8c623b" stroke-width=".55" opacity=".12"/>
    <g stroke="#fff8ed" stroke-width="2.1" stroke-linejoin="round">
      <path d="M0 0H360V180H0Z"/>
      <path d="M120 0V180M180 0V180M240 0V180"/>
    </g>
    <g stroke="#fff8ed" stroke-width="1.6">
      <path d="M120 -5v-8m0 198v8M240 -5v-8m0 198v8" stroke-dasharray="2 2"/>
      <path d="M-6 0h-8m0 180h8M366 0h8m-8 180h8"/>
    </g>
    <path d="M-15 -16H375" stroke="#d6e5ed" stroke-width="1.3" opacity=".75"/>
  </g>

  <!-- Net and post shadows lie on the same playing surface. -->
  <path d="m281 272 165-114 22 6-165 114Z" fill="#765441" opacity=".12"/>
  <path d="m266 284 30 8m166-145 29 8" stroke="#765441" stroke-width="5" stroke-linecap="round" opacity=".13"/>

  <!-- Far post, tension cable and the net's translucent weave. -->
