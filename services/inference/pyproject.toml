[project]
name = "volleymole-service"
version = "0.1.0"
description = "Local inference service for VolleyMole"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volleymole_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
